<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - CSC426</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a12;
      --surface: #12121c;
      --surface2: #1a1a28;
      --border: #252535;
      --accent: #6366f1;
      --accent2: #818cf8;
      --text: #e2e2f0;
      --muted: #6b6b85;
      --success: #34d399;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h1 {
      font-size: 24px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header-info p {
      font-size: 14px;
      color: var(--muted);
    }

    .logout-btn {
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 150ms, transform 100ms;
    }

    .logout-btn:hover { filter: brightness(1.1); }
    .logout-btn:active { transform: scale(0.98); }

    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }

    .welcome-card h2 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 10px;
    }

    .welcome-card p {
      color: var(--muted);
      line-height: 1.6;
    }

    .user-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }

    .info-card label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 8px;
    }

    .info-card .value {
      font-size: 18px;
      color: var(--text);
      font-weight: 600;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 40px;
      padding: 20px;
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .logout-btn {
        width: 100%;
      }

      .welcome-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <div class="logo">🎓</div>
        <div class="header-info">
          <h1>Dashboard</h1>
          <p>CSC426 - Web Development</p>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </header>

    <div class="welcome-card">
      <h2 id="welcomeMsg">Welcome back!</h2>
      <p>You have successfully logged in to the CSC426 Web Development Authentication System.</p>
    </div>

    <div class="user-info-grid">
      <div class="info-card">
        <label>Username</label>
        <div class="value" id="usernameDisplay">-</div>
      </div>
      <div class="info-card">
        <label>Full Name</label>
        <div class="value" id="nameDisplay">-</div>
      </div>
      <div class="info-card">
        <label>Email</label>
        <div class="value" id="emailDisplay">-</div>
      </div>
      <div class="info-card">
        <label>Login Time</label>
        <div class="value" id="loginTimeDisplay">-</div>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 CSC426 Web Development Course. All rights reserved.</p>
    </div>
  </div>

  <script>
    // Load user data from sessionStorage
    window.addEventListener('DOMContentLoaded', () => {
      const userJson = sessionStorage.getItem('user');
      
      if (!userJson) {
        // Redirect to login if no user session
        window.location.href = 'login.html';
        return;
      }

      const user = JSON.parse(userJson);
      
      // Update UI with user info
      document.getElementById('welcomeMsg').textContent = `Welcome back, ${user.name}!`;
      document.getElementById('usernameDisplay').textContent = user.username;
      document.getElementById('nameDisplay').textContent = user.name;
      document.getElementById('emailDisplay').textContent = user.email;
      
      // Format login time
      const loginTime = new Date(user.loginTime);
      document.getElementById('loginTimeDisplay').textContent = loginTime.toLocaleString();
    });

    function handleLogout() {
      sessionStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
